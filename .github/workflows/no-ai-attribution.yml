name: No AI attribution

# Fails a pull request that carries AI authorship credit in its description, in
# a commit message, or in a commit's author or committer identity.
# Product references are allowed.
#
# This repository is a contribution fork. The guard runs on pull requests
# opened here and on manual dispatch only. There is deliberately no push
# trigger: a push of commits synced from upstream would be scanned, and this
# fork neither owns nor may rewrite upstream authorship. On a pull request the
# shared runner scans only that pull request's commit range, so upstream
# history stays out of the result. A manual run carries no pull request, so the
# runner audits the selected ref in full: with no push trigger here, that is
# the only on-demand check this fork has. It never runs pull request code.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Attribution policy
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ryanduguid/release-policy/.github/workflows/attribution-policy.yml@0fab5177a2736b2919a83b433f70636bcab04472
